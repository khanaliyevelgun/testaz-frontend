    "/api/v1/admin/questions": {
      "get": {
        "tags": [
          "Admin: Questions"
        ],
        "summary": "List questions (paginated, filterable by subject and status)",
        "operationId": "list",
        "parameters": [
          {
            "name": "subjectId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32"
            }
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "DRAFT",
                "PENDING_REVIEW",
                "ACTIVE",
                "REJECTED",
                "ARCHIVED"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int32",
              "default": 0
